<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page">
        <!-- LEFT SIDE -->
        <div class="left-side">
            <h1>EXPENSE TRACKER</h1>
            <div class="box">
                <h3 id="formTitle">Add Transaction</h3>
                <label>
                    Type
                    <select id="type" onchange="loadCategories()">
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>
                </label>
                <label>
                    Amount
                    <input type="number" id="amount" step="0.01" placeholder="0.00">
                </label>
                <div class="error" id="amountError"></div>
                <label>
                    Category
                    <select id="category"></select>
                </label>
                <label>
                    Date
                    <input type="date" id="date">
                </label>
                <div class="error" id="dateError"></div>
                <label>
                    Description
                    <input type="text" id="description" placeholder="e.g. Groceries">
                </label>
                <div class="error" id="descError"></div>
                <button onclick="saveTransaction()" id="saveBtn">
                    Add
                </button>
            </div>
        </div>
        <!-- RIGHT SIDE -->
        <div class="right-side">
            <!-- SUMMARY -->
            <div class="summary">
                <div class="summary-box">
                    <h3>Total Income</h3>
                    <p id="totalIncome">₹0.00</p>
                </div>
                <div class="summary-box">
                    <h3>Total Expense</h3>
                    <p id="totalExpense">₹0.00</p>
                </div>
                <div class="summary-box">
                    <h3>Current Balance</h3>
                    <p id="currentBalance">₹0.00</p>
                </div>

            </div>
            <!-- TRANSACTION HISTORY -->
            <div class="transaction-box">
                <h2>Transaction History</h2>
                <!-- FILTERS -->
                <div class="filters">
                    <select id="filterType" onchange="filterTransactions()">
                        <option value="all">All Transactions</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>

                    <select id="filterCategory" onchange="filterTransactions()">
                        <option value="all">All Categories</option>
                        <option value="Food">Food</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Health">Health</option>
                        <option value="Education">Education</option>
                        <option value="Others">Others</option>
                        <option value="Salary">Salary</option>
                        <option value="Freelance">Freelance</option>
                        <option value="Business">Business</option>
                        <option value="Investment">Investment</option>
                        <option value="Gift">Gift</option>
                        <option value="Other Income">Other Income</option>
                    </select>

                </div>
                <!-- TRANSACTION LIST -->
                <div id="transaction-list"></div>
            </div>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
